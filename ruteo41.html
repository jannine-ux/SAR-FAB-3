    <script>
        // Coordenadas del aeropuerto (formato [lat, lng])
        const aeropuertoCoords = [-16.50595, -68.17043];
        
        // Datos de ejemplo de comunidades (reemplaza con tu JSON real)
       const comunidadesData = json_COMUNIDADESJURISDICCION_4;
       const capasmb = [];   //Variable de tipo vector donde se almacenan los mapas base que se cargan en el geovisor
        // Inicializar el mapa
        const map = L.map('map').setView(aeropuertoCoords, 12);
        const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 18,
                    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                    // tileSize: 100
        });
        
        //capasmb.push(tiles);
        capas = L.layerGroup().addTo(map);
        // Añadir capa base
        /*L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);*/
         const googletiles = L.tileLayer('http://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                            maxZoom: 18,
                            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
                }).addTo(map);
        //capasmb.push(googletiles);
        var baseMaps = {
            "OpenStreetMap": tiles,
            "Google Maps": googletiles
        };
        // Marcador del aeropuerto
        const aeropuertoMarker = L.marker(aeropuertoCoords)
            .addTo(map)
            .bindPopup(`
                <div style="text-align: center;">
                    <strong>🏢 Grupo SAR-FAB</strong><br>
                    <em>Punto de partida</em><br>
                    Coord: ${aeropuertoCoords[0].toFixed(6)}, ${aeropuertoCoords[1].toFixed(6)}
                </div>
            `)
            .openPopup();

        // Variable para almacenar la capa de comunidades
        let comunidadesLayer;
        
        // Variable para almacenar la comunidad seleccionada
        let selectedCommunity = null;
        
        // Variable para controlar la ruta actual
        let currentRoute = null;

        // Función para inicializar la capa de comunidades
        function initComunidadesLayer() {
            comunidadesLayer = L.geoJSON(comunidadesData, {
                pointToLayer: function(feature, latlng) {
                    // Verificar que las coordenadas sean válidas
                    if (!latlng || isNaN(latlng.lat) || isNaN(latlng.lng)) {
                        console.error('Coordenadas inválidas para:', feature.properties.nomcomunid);
                        return null;
                    }
                    
                    return L.marker(latlng, {
                        icon: L.icon({
                            iconUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-icon.png',
                            iconSize: [15, 21],
                            iconAnchor: [12, 21],
                            popupAnchor: [1, -34]
                        })
                    });
                },
                onEachFeature: function(feature, layer) {
                    if (feature.properties) {
                        // Validar que las coordenadas existan
                        const lat = parseFloat(feature.properties.y);
                        const lng = parseFloat(feature.properties.x);
                        
                        if (isNaN(lat) || isNaN(lng)) {
                            console.error('Coordenadas inválidas para:', feature.properties.nomcomunid);
                            return;
                        }
                        
                        const popupContent = `
                            <div style="min-width: 200px;">
                                Departamento: ${feature.properties.nom_dep} <br>
                                Municipio ${feature.properties.nom_mun}<br>
                                <strong>Comunidad📍 ${feature.properties.nomcomunid}</strong><br>
                               
                                <button onclick="calcularRuta(${lat}, ${lng}, '${feature.properties.nomcomunid.replace(/'/g, "\\'")}')" 
                                        style="margin-top: 10px; padding: 5px 10px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; width: 100%;">
                                    🗺️ Ruta desde Grupo SAR-FAB
                                </button>
                                <button onclick="abrirReporte('reporte')" 
                                        class="popup-button report-button">
                                    📊 Reporte
                                </button>
                                 <button onclick="abrirReporteR1('reporte')" 
                                        class="popup-button report-button">
                                    📊 Rescate Acuatico
                                </button>
                                 <button onclick="abrirReporteR2('reporte')" 
                                        class="popup-button report-button">
                                    📊 Rescate Vertical
                                </button>
                                 <button onclick="abrirReporteR3('reporte')" 
                                        class="popup-button report-button">
                                    📊 Rescate Forestal
                                </button>
                                <button onclick="abrirReporteR4('reporte')" 
                                        class="popup-button report-button">
                                    📊 Transporte
                                </button>
                                <button onclick="abrirReporte01('reporte')" 
                                        class="popup-button report-button">
                                    📊 Andinismo
                                </button>
                                 <button onclick="abrirReporte02('reporte')" 
                                        class="popup-button report-button">
                                    📊 Atencion Prehospitalaria
                                </button>
                            </div>
                        `;
                        layer.bindPopup(popupContent);
                        
                        // Almacenar datos para la búsqueda
                        layer._searchData = {
                            name: feature.properties.nomcomunid,
                            lat: lat,
                            lng: lng
                        };
                    }
                }
            }).addTo(map);
        }

        // Inicializar la capa de comunidades
        initComunidadesLayer();

        // Función para abrir reporte PDF (disponible globalmente)
        window.abrirReporte = function(comunidadNombre) {

        // Función para abrir reporte PDF (disponible globalmente)

        // Función para abrir reporte PDF (disponible globalmente)

            // Simulamos la apertura del reporte PDF

        // Función para abrir reporte PDF (disponible globalmente)

        // Función para abrir reporte PDF (disponible globalmente)
        window.abrirReporteR4 = function(comunidadNombre) {
            // Simulamos la apertura del reporte PDF

            const url = `files/TRANSPORTE.pdf`;
            window.open(url, '_blank');
            console.log("Abriendo reporte para:", comunidadNombre, "URL:", url);
        };

        // Función para ocultar todas las comunidades excepto la seleccionada
        function hideOtherCommunities(selectedCommunityName) {
            comunidadesLayer.eachLayer(function(layer) {
                if (layer._searchData && layer._searchData.name !== selectedCommunityName) {
                    map.removeLayer(layer);
                }
            });
        }

        // Función para mostrar todas las comunidades
        function showAllCommunities() {
            map.removeLayer(comunidadesLayer);
            initComunidadesLayer();
        }

        // Función para calcular y mostrar la ruta (disponible globalmente)
        window.calcularRuta = function(lat, lng, comunidadNombre) {
            // Validar coordenadas
            if (isNaN(lat) || isNaN(lng)) {
                console.error('Coordenadas inválidas:', lat, lng);
                alert('Coordenadas inválidas para la comunidad: ' + comunidadNombre);
                return;
            }
            
            // Eliminar ruta anterior si existe
            if (currentRoute) {
                map.removeControl(currentRoute);
                currentRoute = null;
            }

            // Ocultar otras comunidades
            hideOtherCommunities(comunidadNombre);
            selectedCommunity = comunidadNombre;

            // Mostrar información de la ruta
            document.getElementById('route-info').style.display = 'block';
            document.getElementById('distance').innerHTML = '<strong>Distancia:</strong> Calculando...';
            document.getElementById('time').innerHTML = '<strong>Tiempo estimado:</strong> Calculando...';

            // Crear nueva ruta
            currentRoute = L.Routing.control({
                waypoints: [
                    L.latLng(aeropuertoCoords[0], aeropuertoCoords[1]),
                    L.latLng(lat, lng)
                ],
                routeWhileDragging: false,
                showAlternatives: false,
                addWaypoints: false,
                lineOptions: {
                    styles: [{color: '#8000FF', opacity: 0.7, weight: 6}]
                },
                createMarker: function(i, waypoint, n) {
                    // Solo mostrar marcador para el aeropuerto (punto de inicio)
                    if (i === 0) {
                        return L.marker(waypoint.latLng, {
                            icon: L.icon({
                                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
                                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/local-6634.gif',
                                iconSize: [25, 41],
                                iconAnchor: [12, 41],
                                popupAnchor: [1, -34],
                                shadowSize: [41, 41]
                            })
                        }).bindPopup('🏢 <strong>Aeropuerto</strong><br>Punto de partida');
                    }
                    return null;
                },
                formatter: new L.Routing.Formatter({
                    language: 'es',
                    units: 'metric'
                })

        var lay = L.control.layers.tree(null, overlaysTree,{
            namedToggle: true,
            
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: false, 
        });
        lay.addTo(map);
        document.addEventListener("DOMContentLoaded", function() {
            // set new Layers List height which considers toggle icon
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height 
                        || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            // toggle Collapsed/Expanded and apply new Layers List height
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });	
			// apply new Layers List height if toggle layerstree
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) {
						newLayersListHeight();
					}
				});
			}
            // Collapsed/Expanded at Start to apply new height
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            // Collapsed touch/small screen
            var isSmallScreen = window.innerWidth < 650;
            if (isSmallScreen) {
                setTimeout(function() {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                    isLayersListExpanded = !isLayersListExpanded;
                }, 500);
            }  
        }); 
        //-------------------------------------------------------------------------------
        // Botón para limpiar ruta
        document.getElementById('clear-route').addEventListener('click', function() {
            if (currentRoute) {
                map.removeControl(currentRoute);
                currentRoute = null;
            }
            
            // Mostrar todas las comunidades nuevamente
            showAllCommunities();
            selectedCommunity = null;
            
            document.getElementById('route-info').style.display = 'none';
            map.setView(aeropuertoCoords, 12);
        });

        // Ajustar el mapa para que muestre todas las comunidades y el aeropuerto
        setTimeout(() => {
            const allCoords = [];
            
            // Recorrer todas las características y agregar coordenadas válidas
            comunidadesData.features.forEach(f => {
                const lat = parseFloat(f.properties.y);
                const lng = parseFloat(f.properties.x);
                
                if (!isNaN(lat) && !isNaN(lng)) {
                    allCoords.push([lat, lng]);
                }
            });
            
            allCoords.push(aeropuertoCoords);
            
            if (allCoords.length > 0) {
                const bounds = L.latLngBounds(allCoords);
                // map.fitBounds(bounds, { padding: [50, 50] }); // Esto hace autozoom a las comunidades
            }
        }, 1000);

        // Manejar errores del routing
        L.Routing.errorControl = function(options) {
            return L.Routing.Itinerary.extend({
                options: {
                    containerClassName: 'routing-error-container'
                },
                
                createContainer: function() {
                    const container = L.Routing.Itinerary.prototype.createContainer.call(this);
                    container.style.display = 'none';
                    return container;
                }
            });
        };

        // Función para mostrar coordenadas en el click (útil para debugging)
        map.on('click', function(e) {
            console.log('Coordenadas click:', e.latlng.lat, e.latlng.lng);
        });

        console.log('Sistema de búsqueda y enrutamiento cargado correctamente');
    </script>
